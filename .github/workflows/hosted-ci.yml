name: Hosted Linux CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-linux-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recovery-reference:
    name: Unmodified recovery reference and public fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=2'
      GOWORK: 'off'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tools/recoveryreference/go.mod
          cache: false
      - name: Verify and test the independent public reference
        working-directory: tools/recoveryreference
        run: |
          go mod download
          go mod verify
          go test -race -count=1 ./...
      - name: Reproduce the committed public fixture bytes
        working-directory: tools/recoveryreference
        run: |
          go run . > "$RUNNER_TEMP/recovery-public.json"
          cmp "$RUNNER_TEMP/recovery-public.json" ../../internal/keyvault/testdata/recovery/reference-public.json
      - name: Reproduce the committed index-7 root grants fixture bytes
        working-directory: tools/recoveryreference
        run: |
          go run ./rootgrants > "$RUNNER_TEMP/root-grants-reference.json"
          test -s "$RUNNER_TEMP/root-grants-reference.json"
          cmp "$RUNNER_TEMP/root-grants-reference.json" ../../internal/keyvault/testdata/recovery/reference-root-grants.json
      - name: Regeneration diff detects a planted index-7 fixture change
        working-directory: tools/recoveryreference
        run: |
          fixture=../../internal/keyvault/testdata/recovery/reference-root-grants.json
          sed 's/"public_key": "a98cbb1b/"public_key": "a98cbb1c/' "$fixture" > "$RUNNER_TEMP/root-grants-planted.json"
          if cmp -s "$fixture" "$RUNNER_TEMP/root-grants-planted.json"; then
            echo 'the planted change was not applied' >&2
            exit 1
          fi
          if cmp -s "$RUNNER_TEMP/root-grants-reference.json" "$RUNNER_TEMP/root-grants-planted.json"; then
            echo 'the regeneration diff did not detect the planted change' >&2
            exit 1
          fi

  linux:
    name: Go vet and race tests (Linux)
    runs-on: ubuntu-latest
    # Allow setup plus the bounded upstream suites; product timing is separate.
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=2'
      MAC_KEYVAULT_SKIP_KEYCHAIN: '1'
    steps:
      - name: Check out the PR head or pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: List Linux-buildable Go packages
        run: go list ./...
      - name: Vet every Linux-buildable Go package
        run: go vet ./...
      - name: Inventory committed MU interop cases
        run: |
          cases=$(find interop/multi-use-grants/cases -maxdepth 1 -type f -name '*.json' | wc -l)
          echo "TestMUInteropVectors committed cases: $cases"
          test "$cases" -ge 72
      - name: Check out the immutable lab fixture base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dffe3ac5c86e2e8869efc3b869d35f845e1bd71a
          path: .ci-lab-source
          persist-credentials: false
      - name: Build separately pinned lab verifier and signer
        shell: bash
        run: |
          set -euo pipefail
          echo 'd0e442e35940972cf5fa7298df922e32c1cdf5b6024c5268115506a204abcd89  .github/fixtures/pinned-lab.bundle' | sha256sum -c -
          # Keep the independent native source inventory outside the candidate module.
          fixture_source="$RUNNER_TEMP/lab-fixture-source"
          mv "$GITHUB_WORKSPACE/.ci-lab-source" "$fixture_source"
          fixture_bin="$RUNNER_TEMP/lab-fixture-bin"
          mkdir -m 700 "$fixture_bin"
          test "$(git -C "$fixture_source" rev-parse HEAD)" = dffe3ac5c86e2e8869efc3b869d35f845e1bd71a
          git -C "$fixture_source" fetch "$GITHUB_WORKSPACE/.github/fixtures/pinned-lab.bundle" refs/fixtures/verifier refs/fixtures/signer
          git -C "$fixture_source" checkout --detach 12b3ffac1993cc5b35074b569018b4db7c9bbd82
          test "$(git -C "$fixture_source" rev-parse HEAD^{tree})" = a553906c37721d8f2adbdb1051cf1cef0eb54c49
          (
            cd "$fixture_source"
            go mod download
            go mod verify
            go build -o "$fixture_bin/swarma-keyvault" ./cmd/swarma-keyvault
          )
          git -C "$fixture_source" checkout --detach 1045aac3ea204722aaaf0e60dac69eb8f622a7fb
          test "$(git -C "$fixture_source" rev-parse HEAD^{tree})" = b129a24428cdf5f2cc56fa5d9f27749c4a12065a
          (
            cd "$fixture_source"
            go mod download
            go mod verify
            go build -o "$fixture_bin/labtestsigner" ./tools/labtestsigner
          )
          go mod download
          go mod verify
          go build -o "$fixture_bin/labcompose" ./tools/labcompose
          go build -o "$fixture_bin/labownnode" ./tools/labownnode
          go build -o "$fixture_bin/candidate-swarma-keyvault" ./cmd/swarma-keyvault
          # Fake CLI transport only: avoid per-call race-runtime exit sleeps.
          # The actual wrapper and protocol tests remain in the full race suite.
          go test -c -o "$fixture_bin/fake-node-cli" ./lab/namecoinwrapper
          for binary in swarma-keyvault labtestsigner labcompose labownnode candidate-swarma-keyvault fake-node-cli; do
            test -f "$fixture_bin/$binary" && test -x "$fixture_bin/$binary" && test -O "$fixture_bin/$binary"
            test ! -L "$fixture_bin/$binary"
          done
          echo "LAB_KEYVAULT_CLI=$fixture_bin/swarma-keyvault" >> "$GITHUB_ENV"
          echo "LAB_CANDIDATE_KEYVAULT_CLI=$fixture_bin/candidate-swarma-keyvault" >> "$GITHUB_ENV"
          echo "KEYVAULT_BIN=$fixture_bin/swarma-keyvault" >> "$GITHUB_ENV"
          echo "LAB_TEST_SIGNER=$fixture_bin/labtestsigner" >> "$GITHUB_ENV"
          echo "LAB_COMPOSE=$fixture_bin/labcompose" >> "$GITHUB_ENV"
          echo "LAB_OWN_NODE=$fixture_bin/labownnode" >> "$GITHUB_ENV"
          echo "LAB_NODE_FIXTURE_CLI=$fixture_bin/fake-node-cli" >> "$GITHUB_ENV"
      # Discover all Linux-buildable Go packages with ./...; none is excluded.
      # Go excludes the Darwin-only Security.framework/Keychain cgo backend,
      # KEK code-identity inspection, sandbox-exec and Enclave helper tests,
      # macOS peer/publication implementations, kekclient identity tests, and
      # grants/mu_journal_append_test.go (Darwin UF_APPEND / Chflags semantics).
      # Non-Darwin stubs refuse native custody/identity operations. The skip
      # environment also disables attended real-Keychain/Enclave tests.
      # cmd/mac-keyvault-enclave is Swift/CryptoKit, not a Go package.
      # Native custody qualification remains a separate confined macOS gate.
      - name: Build the complete-suite supervisor
        run: go build -o "$RUNNER_TEMP/suite-runner" ./tools/suiterunner
      - name: Race-test every Linux-buildable Go package
        # This deadline covers the entire command, including compilation and
        # aggregate package execution. Go's -timeout bounds each binary only.
        timeout-minutes: 32
        run: |
          # Permission-refusal fixtures create deliberately world-readable files.
          umask 022
          export MAC_KEYVAULT_SKIP_KEYCHAIN=1
          exec "$RUNNER_TEMP/suite-runner" --timeout=30m -- go test -race -count=1 -timeout=30m -v ./...

  suite-budget-control:
    name: Whole-suite deadline and descendant cleanup control
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up the fixture's exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: scripts/tests/testdata/suite-budget/go.mod
          cache: false
      - name: Prepare private fixture directories
        run: |
          mkdir -m 700 "$RUNNER_TEMP/suite-budget-control"
          mkdir -m 700 "$RUNNER_TEMP/suite-budget-control/positive" "$RUNNER_TEMP/suite-budget-control/deadline" "$RUNNER_TEMP/suite-budget-control/native" "$RUNNER_TEMP/suite-budget-control/outsider"
          echo "KEYVAULT_SUITE_CONTROL=$RUNNER_TEMP/suite-budget-control" >> "$GITHUB_ENV"
          # Compile control fixtures before their short scaled clocks. This
          # does not move any product-suite build outside its 30-minute step.
          go -C scripts/tests/testdata/suite-budget test -run '^$' ./...
          go build -o "$RUNNER_TEMP/suite-runner" ./tools/suiterunner
          go -C scripts/tests/testdata/suite-budget test -c -o "$RUNNER_TEMP/suite-budget-control/outsider.test" ./a
          KEYVAULT_SUITE_CONTROL="$RUNNER_TEMP/suite-budget-control" KEYVAULT_SUITE_PHASE=outsider KEYVAULT_SUITE_LEAF=a "$RUNNER_TEMP/suite-budget-control/outsider.test" -test.run='^TestBudgetFixture$' -test.timeout=6m >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/suite-budget-control/outsider.pid"
      - name: Individually healthy binaries complete under a roomy suite deadline
        id: suite-positive
        timeout-minutes: 3
        env:
          KEYVAULT_SUITE_PHASE: positive
        run: |
          date +%s > "$KEYVAULT_SUITE_CONTROL/positive-start"
          exec "$RUNNER_TEMP/suite-runner" --timeout=2m --report="$KEYVAULT_SUITE_CONTROL/positive-result.json" -- go -C scripts/tests/testdata/suite-budget test -count=1 -timeout=45s -v ./a ./b ./c
      - name: Supervisor deadline bounds the complete healthy aggregate
        id: suite-deadline
        timeout-minutes: 2
        continue-on-error: true
        env:
          KEYVAULT_SUITE_PHASE: deadline
        run: |
          date +%s > "$KEYVAULT_SUITE_CONTROL/deadline-start"
          exec "$RUNNER_TEMP/suite-runner" --timeout=1m --report="$KEYVAULT_SUITE_CONTROL/deadline-result.json" -- go -C scripts/tests/testdata/suite-budget test -count=1 -timeout=45s -v ./a ./b ./c
      - name: Native fallback must stop the supervised suite
        id: suite-negative
        timeout-minutes: 1
        continue-on-error: true
        env:
          KEYVAULT_SUITE_PHASE: native
        run: |
          date +%s > "$KEYVAULT_SUITE_CONTROL/native-start"
          exec "$RUNNER_TEMP/suite-runner" --timeout=2m --report="$KEYVAULT_SUITE_CONTROL/native-result.json" -- go -C scripts/tests/testdata/suite-budget test -count=1 -timeout=45s -v ./a ./b ./c
      - name: Require aggregate refusal and no surviving owned processes
        if: always()
        env:
          KEYVAULT_SUITE_POSITIVE: ${{ steps.suite-positive.outcome }}
          KEYVAULT_SUITE_DEADLINE: ${{ steps.suite-deadline.outcome }}
          KEYVAULT_SUITE_NEGATIVE: ${{ steps.suite-negative.outcome }}
        run: go -C scripts/tests/testdata/suite-budget test -count=1 -timeout=30s -v ./budget -run 'TestHostedDeadlineResult|TestRecordContract|TestRunnerResultContract'

  suite-budget-evidence:
    name: Require native suite-deadline cause
    needs: suite-budget-control
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up the fixture's exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: scripts/tests/testdata/suite-budget/go.mod
          cache: false
      - name: Check the completed control job's actual timeout annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          control_job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | select(.name == "Whole-suite deadline and descendant cleanup control") | .id')
          case "$control_job" in ''|*[!0-9]*) echo 'unique control job id required' >&2; exit 1;; esac
          # Raw control log stays in runner scratch; it is never echoed.
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$control_job/logs" > "$RUNNER_TEMP/suite-budget-control.log"
          KEYVAULT_SUITE_JOB_LOG="$RUNNER_TEMP/suite-budget-control.log" GOTOOLCHAIN=local GOWORK=off GOPROXY=off go -C scripts/tests/testdata/suite-budget test -count=1 -v ./budget -run 'TestHostedDeadlineAnnotation|TestAnnotationContract'

  verifier-latency:
    name: Real verifier non-race (40/path, advisory timing and final completion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=2'
      MAC_KEYVAULT_SKIP_KEYCHAIN: '1'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out setup from the immutable workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-verifier-route
          persist-credentials: false
      - name: Install the exact package only on a disposable GitHub-hosted VM
        shell: bash
        env:
          VS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          VS_RUNNER_OS: ${{ runner.os }}
          VS_RUNNER_ARCH: ${{ runner.arch }}
          VS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VS_WORKFLOW_REPOSITORY: ${{ github.repository }}
          VS_WORKFLOW_PATH: .github/workflows/hosted-ci.yml
        run: |
          set -euo pipefail
          # Capture both statuses before another command overwrites PIPESTATUS.
          set +e
          bash .ci-verifier-route/scripts/verifier-hosted-package.sh 2>&1 | tee verifier-setup.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${pipeline_status[0]}" -ne 0 ]; then
            exit "${pipeline_status[0]}"
          fi
          exit "${pipeline_status[1]}"
      - name: Permit user namespaces only on the disposable GitHub-hosted Ubuntu VM
        shell: bash
        env:
          VS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          VS_RUNNER_OS: ${{ runner.os }}
          VS_RUNNER_ARCH: ${{ runner.arch }}
          VS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VS_WORKFLOW_REPOSITORY: ${{ github.repository }}
          VS_WORKFLOW_PATH: .github/workflows/hosted-ci.yml
        run: |
          set -euo pipefail
          set +e
          bash .ci-verifier-route/scripts/verifier-hosted-userns.sh 2>&1 | tee verifier-userns.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${pipeline_status[0]}" -ne 0 ]; then
            exit "${pipeline_status[0]}"
          fi
          exit "${pipeline_status[1]}"
      - name: Measure once, 40 per path, advisory timing and final completion, zero retries
        shell: bash
        run: |
          set -euo pipefail
          # Capture both statuses before another command overwrites PIPESTATUS.
          set +e
          bash scripts/verifier-latency-confined.sh 2>&1 | tee verifier-p95.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${pipeline_status[0]}" -ne 0 ]; then
            exit "${pipeline_status[0]}"
          fi
          exit "${pipeline_status[1]}"
      - name: Preserve timing samples even on failure
        if: always()
        run: |
          for log in verifier-setup.log verifier-userns.log verifier-p95.log; do
            if [ -f "$log" ]; then cat "$log" >> "$GITHUB_STEP_SUMMARY"; fi
          done

  verifier-attribution:
    name: Verifier ABBA attribution (diagnostic only)
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostics/t1-abba-261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=2'
      MAC_KEYVAULT_SKIP_KEYCHAIN: '1'
    steps:
      - name: Check out the exact diagnostic recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up the shared diagnostic Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check out setup from the immutable workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-verifier-route
          persist-credentials: false
      - name: Check out exact control A
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: fcaf645a6efce742a9778202873d8a7be69f172b
          path: .diagnostic-a
          persist-credentials: false
      - name: Check out exact control B
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 82886f1d90e3136e1708699036f7990d12385cb2
          path: .diagnostic-b
          persist-credentials: false
      - name: Install the exact package only on a disposable GitHub-hosted VM
        shell: bash
        env:
          VS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          VS_RUNNER_OS: ${{ runner.os }}
          VS_RUNNER_ARCH: ${{ runner.arch }}
          VS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VS_WORKFLOW_REPOSITORY: ${{ github.repository }}
          VS_WORKFLOW_PATH: .github/workflows/hosted-ci.yml
        run: |
          set -euo pipefail
          bash .ci-verifier-route/scripts/verifier-hosted-package.sh
      - name: Permit namespaces only on the disposable GitHub-hosted Ubuntu VM
        shell: bash
        env:
          VS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          VS_RUNNER_OS: ${{ runner.os }}
          VS_RUNNER_ARCH: ${{ runner.arch }}
          VS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VS_WORKFLOW_REPOSITORY: ${{ github.repository }}
          VS_WORKFLOW_PATH: .github/workflows/hosted-ci.yml
        run: |
          set -euo pipefail
          bash .ci-verifier-route/scripts/verifier-hosted-userns.sh
      - name: Prepare both instrumented sources and compile without running tests
        shell: bash
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION)" = go1.26.10
          test "$(git -C .diagnostic-a rev-parse HEAD)" = fcaf645a6efce742a9778202873d8a7be69f172b
          test "$(git -C .diagnostic-b rev-parse HEAD)" = 82886f1d90e3136e1708699036f7990d12385cb2
          test -z "$(git -C .diagnostic-a status --porcelain)"
          test -z "$(git -C .diagnostic-b status --porcelain)"
          printf '%s\n' \
            '684b8ced06902d22ba4b2e9d4c58af5c22cefb5967ff97e81f622bbb393ca094  tools/verifierdiagnostic/patches/main.patch' \
            '64a55c2345f6f49b16fa51c4bedc1ea332ad06de38fef5102c164319badbfc75  tools/verifierdiagnostic/patches/r8.patch' | sha256sum -c -
          git -C .diagnostic-a rev-parse 'HEAD^{tree}'
          git -C .diagnostic-b rev-parse 'HEAD^{tree}'
          git -C .diagnostic-a apply --check "$GITHUB_WORKSPACE/tools/verifierdiagnostic/patches/main.patch"
          git -C .diagnostic-b apply --check "$GITHUB_WORKSPACE/tools/verifierdiagnostic/patches/r8.patch"
          git -C .diagnostic-a apply "$GITHUB_WORKSPACE/tools/verifierdiagnostic/patches/main.patch"
          git -C .diagnostic-b apply "$GITHUB_WORKSPACE/tools/verifierdiagnostic/patches/r8.patch"
          for source in .diagnostic-a .diagnostic-b; do
            git -C "$source" diff --stat
            (cd "$source" && sha256sum internal/grants/{linux_admission_evidence.go,linux_verifier_timing_test.go,mu_state.go,verifier_latency_harness_test.go,zz_verifier_storage_diagnostic_test.go} scripts/verifier-latency-confined.sh)
          done
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/verifier-diagnostic"
          go test -race -count=1 ./tools/verifierdiagnostic
          go build -o "$RUNNER_TEMP/verifier-diagnostic/coordinator" ./tools/verifierdiagnostic
          go -C .diagnostic-a mod download
          go -C .diagnostic-b mod download
          go -C .diagnostic-a test -c -o "$RUNNER_TEMP/verifier-diagnostic/test-a" ./internal/grants
          go -C .diagnostic-b test -c -o "$RUNNER_TEMP/verifier-diagnostic/test-b" ./internal/grants
          go -C .diagnostic-b build -o "$RUNNER_TEMP/verifier-diagnostic/suite-runner" ./tools/suiterunner
          go version
          go version -m "$RUNNER_TEMP/verifier-diagnostic/coordinator" "$RUNNER_TEMP/verifier-diagnostic/suite-runner"
          sha256sum "$RUNNER_TEMP/verifier-diagnostic/"{coordinator,suite-runner,test-a,test-b}
      - name: Collect all four ABBA diagnostics with the original product fence
        shell: bash
        timeout-minutes: 26
        run: |
          set -euo pipefail
          exec "$RUNNER_TEMP/verifier-diagnostic/suite-runner" \
            --timeout=24m --report="$RUNNER_TEMP/verifier-diagnostic/outer-result.json" -- \
            "$RUNNER_TEMP/verifier-diagnostic/coordinator" \
            -a "$GITHUB_WORKSPACE/.diagnostic-a" -b "$GITHUB_WORKSPACE/.diagnostic-b" \
            -out "$RUNNER_TEMP/verifier-diagnostic/collections" \
            -supervisor "$RUNNER_TEMP/verifier-diagnostic/suite-runner"
      - name: Retain the outer supervisor outcome after success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/verifier-diagnostic/outer-result.json"
          if [ -f "$report" ] && [ ! -L "$report" ]; then
            test "$(stat -c %s "$report")" -le 65536
            sha256sum "$report"
            cat -- "$report"
          else
            echo 'Outer supervisor report unavailable; diagnostic completeness is unverified.' >&2
            exit 1
          fi
